name: Build and Release APK & Play Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1 or 1.0.1)"
        required: true
        type: string
      version_code:
        description: "Version Code (integer, must increase every release; e.g. 5)"
        required: true
        type: string
      play_track:
        description: "Google Play Track"
        required: true
        type: choice
        default: "internal"
        options:
          - internal
          - alpha
          - beta
          - production
      deploy_to_play:
        description: "Deploy to Google Play Store"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Patch React Native Gradle plugin
        run: node scripts/patch-rn-gradle-plugin.js

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/my-upload-key.keystore

      - name: Build release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION_NAME="${{ inputs.tag }}"
          VERSION_NAME="${VERSION_NAME#v}"

          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PMYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ inputs.version_code }}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk dgbuzzer.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: DGBuzzer ${{ inputs.tag }}
          files: dgbuzzer.apk
          generate_release_notes: true

      - name: Deploy to Google Play
        if: ${{ inputs.deploy_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: in.darkglance.dgbuzzer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
