name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1 or 1.0.1)"
        required: true
        type: string
      version_code:
        description: "Version Code (integer, e.g. 5). Optional - leave blank to use default (4)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # RN 0.72's Gradle plugin was built for older Gradle.
      # Under Gradle 8.13, serviceOf is no longer on the classpath and Kotlin 2.0 metadata check fails.
      - name: Patch React Native Gradle plugin
        run: |
          node -e '
          const fs = require("fs");
          const file = "node_modules/@react-native/gradle-plugin/build.gradle.kts";
          let c = fs.readFileSync(file, "utf8");
          c = c.replace(/import org\.gradle\.configurationcache\.extensions\.serviceOf/g, "");
          c = c.replace(/testRuntimeOnly\([\s\S]*?\.first\(\)\)\)/g, "");
          if (!c.includes("skip-metadata-version-check")) {
            c = c.replace(
              /languageVersion = "1\.5"/,
              "languageVersion = \"1.5\"\\n    freeCompilerArgs = freeCompilerArgs + \"-Xskip-metadata-version-check\""
            );
          }
          fs.writeFileSync(file, c);
          '

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/my-upload-key.keystore

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION_NAME="${{ inputs.tag }}"
          VERSION_NAME="${VERSION_NAME#v}"

          GRADLE_ARGS=(
            assembleRelease --no-daemon
            -PMYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            -PversionName="$VERSION_NAME"
          )

          if [ -n "${{ inputs.version_code }}" ]; then
            GRADLE_ARGS+=("-PversionCode=${{ inputs.version_code }}")
          fi

          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk dgbuzzer.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: DGBuzzer ${{ inputs.tag }}
          files: dgbuzzer.apk
          generate_release_notes: true
