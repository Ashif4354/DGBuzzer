// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 36
        kotlinVersion = "1.9.23"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// AGP 8+ requires a namespace for every Android module. Older React Native libraries
// only declare `package` in AndroidManifest.xml, so derive the namespace from there.
subprojects { subproject ->
    subproject.afterEvaluate {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null && subproject != rootProject.findProject(":app")) {
            if (!androidExt.namespace) {
                def manifest = subproject.file("src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def pkg = new XmlSlurper().parse(manifest).@package.text()
                    if (pkg) {
                        androidExt.namespace = pkg
                    }
                }
            }
            // Libraries may still rely on generated BuildConfig classes.
            androidExt.buildFeatures.buildConfig = true
        }
    }
}
